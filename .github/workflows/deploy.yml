name: Deploy to EC2 via Bastion

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through bastion to both private instances
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.BASTION_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          debug: true
          script: |
            ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.PRIVATE_IP_1 }} 'bash ~/aws-webapp-pvt-ec2/deploy.sh'
            ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.PRIVATE_IP_2 }} 'bash ~/aws-webapp-pvt-ec2/deploy.sh'
